replicaCount: 2

image:
  repository: ghcr.io/bayleafwalker/bindery-core
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

env:
  BINDERY_EXTERNAL_RUNTIME_ADDR: ":8080"

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true

