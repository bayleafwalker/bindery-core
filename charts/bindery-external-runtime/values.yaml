# The file-backed v1 store is single-writer. Use a shared relational store
# before making this greater than one.
replicaCount: 1

# Full bindery-core Git commit embedded in every placement decision. The
# service refuses to start when this is not an exact 40-character revision.
buildRevision: ""

image:
  repository: ghcr.io/bayleafwalker/bindery-core
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

env:
  BINDERY_EXTERNAL_RUNTIME_ADDR: ":8080"

persistence:
  enabled: true
  existingClaim: ""
  mountPath: /var/lib/bindery
  size: 1Gi
  accessModes: [ReadWriteOnce]
  storageClass: ""

secretEnv: []

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true
