# The file-backed v1 store is single-writer. Use a shared relational store
# before making this greater than one.
replicaCount: 1

# Full bindery-core Git commit embedded in every placement decision. The
# service refuses to start when this is not an exact 40-character revision.
buildRevision: ""

image:
  # The external runtime has its own image. It shares a repository with the
  # operator but not an artifact: this Dockerfile.external-runtime build
  # contains only bindery-external-runtime and bindery-udp-relay, and the
  # operator chart (helm/bindery-core) pulls ghcr.io/bayleafwalker/bindery-core.
  # Pointing both charts at one name would let a bindery-core install deploy
  # this service instead of the operator.
  repository: ghcr.io/bayleafwalker/bindery-external-runtime
  # Empty means the chart appVersion, so the chart and the image it deploys
  # cannot drift apart. Pin only to override.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

env:
  BINDERY_EXTERNAL_RUNTIME_ADDR: ":8080"

persistence:
  enabled: true
  existingClaim: ""
  mountPath: /var/lib/bindery
  size: 1Gi
  accessModes: [ReadWriteOnce]
  storageClass: ""

secretEnv: []

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true
