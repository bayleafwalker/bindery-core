schema: bindery.external-runtime-roadmap/v1
recorded_at: 2026-08-25
trigger: ra2-two-client-vertical-slice
claim: empirically-demonstrated-once
evidence:
  external_runtime: ra2-yr-cncnet-v0.2
  participants: 2
  matching_event_count_per_participant: 6651
  adapter_tests_reported: 39
  historical_limit: >-
    The run predates durable execution, placement, and evidence-set IDs. Do not
    fabricate those identifiers retroactively; repeat through the hardened
    control plane.
work:
  - id: ERH-001
    title: Persist the control-plane identity graph
    status: implemented
    scope: [identity, session, placement, execution, enrollment, idempotency]
    acceptance:
      - Every evidence reference resolves after a broker restart.
      - A failed durable write rolls back the in-memory mutation.
      - The file-backed mode has exactly one writer.
  - id: ERH-002
    title: Promote observation reconciliation into Bindery Core
    status: implemented
    depends_on: [ERH-001]
    acceptance:
      - Two distinct observers with counts 6651 and 6651 reconcile as consistent.
      - Unequal counts remain attributable and reconcile as inconsistent.
      - Unsupported methods fail explicitly.
  - id: ERH-003
    title: Make gate applicability a typed result
    status: implemented
    acceptance:
      - Outcomes are PASS, FAIL, NOT_APPLICABLE, UNRESOLVED, or ERROR.
      - Missing context cannot silently become FAIL.
  - id: ERH-004
    title: Require verifier calibration evidence
    status: implemented
    depends_on: [ERH-003]
    acceptance:
      - Consequential gates carry version and implementation hash.
      - Known-pass and known-fail controls both match expectation.
      - An always-failing verifier is ERROR, not a strict gate.
  - id: ERH-005
    title: Resolve allocator implementation identity
    status: implemented
    depends_on: [ERH-001]
    acceptance:
      - Every placement records implementation, repository, revision, and config digest.
      - The reference service refuses an unresolved build revision.
  - id: ERH-006
    title: Repeat the RA2 run through durable IDs
    status: pending
    depends_on: [ERH-001, ERH-002, ERH-003, ERH-004, ERH-005]
    acceptance:
      - The evidence set resolves to execution, session, placement, and identities after restart.
      - Exact-count reconciliation records the two client streams without adapter-owned adjudication.
    enabler_landed: 2026-08-26
    enabler_note: >-
      The control plane now serves the capture plane, derives observation
      summaries from persisted events, and refuses client-supplied counts for
      any execution that has captured streams. Both acceptance criteria are
      demonstrated in-process against the reference 6,651-event fixture by
      internal/externalruntime/state_store_test.go and erh006_test.go.

      This item stays pending on purpose. What has been built is the ability to
      run RA2 through durable identifiers; nobody has run it. The item closes
      when two real clients complete a match through this control plane, not
      when the tests that would let them pass.
  - id: ERH-007
    title: Run a non-RA2 external runtime
    status: pending
    depends_on: [ERH-006]
    constraints:
      - materially-different-integration-mechanism
      - adapter-swap-only
      - no-new-core-game-specific-fields
    acceptance:
      - Session, placement, execution, observation, and evidence contracts survive unchanged.
      - A second adapter implementation is sufficient.
      - A restart drill and positive/negative gate controls are included.
status_legend:
  implemented: >-
    Code exists and is exercised by CI on main. Since 2026-08-26 that means the
    unified workflow, which compiles the operator and the external runtime in
    one module -- not the former external-runtime-only workflow, which could not
    fail on operator breakage.
  implemented-unconsumed: >-
    Code exists and is unit-tested, but nothing in a production path imports it.
    No item currently carries this status: `pkg/gatev1` acquired its caller on
    2026-08-26 in internal/externalruntime/capture_gate.go, which evaluates the
    consequential gate `bindery.capture.completeness` over every capture before
    it may contribute to an evidence set. The status is kept in the legend
    because it is a distinction worth being able to make again.
  pending: Not started.

ordering_rule: >-
  Do not spend the next slice on richer RA2 behavior. Close ERH-001 through
  ERH-006, then use ERH-007 to test abstraction.

  As of 2026-08-26 every ERH-006 dependency is implemented and consumed. What
  remains for ERH-006 is a run, not a build.

relay_seam_note: >-
  As of 2026-08-26 the allocator seam reaches a relay this project controls.
  BINDERY_RELAY_PROVIDER=bindery-native runs internal/relay inside
  bindery-external-runtime: sessions allocate on it, and each enrolling client
  is admitted to that allocation through the new externalruntime.RelayAdmitter
  seam. cmd/bindery-external-runtime/native_relay_test.go drives two clients
  through session creation and enrollment and then forwards real datagrams
  between them over a UDP socket, signed with the transport credentials the
  control plane issued.

  This closes a gap, not an item. Before it, cmd/bindery-external-runtime
  refused every provider except cncnet-private, and internal/relay learned its
  allocations only from BINDERY_RELAY_ALLOCATION_ID and BINDERY_RELAY_CLIENTS
  at boot; the two programs never met. A session created through the control
  plane therefore could not cause Bindery's own relay to accept anything, which
  is why internal/harness had no production caller.

  What it claims is a capability -- the control plane can allocate on a relay it
  controls -- and nothing about behavior under load, over a real network, or
  against a game. The in-process boundary is deliberate and load-bearing:
  enrollment mints a client's transport key, returns it once and keeps only a
  sha256 verifier, so the key can reach the relay only during the enrollment
  call. A separate relay process needs an authenticated, encrypted admin
  channel before the same seam can span it, and ERM-503's scale-out and drain
  work needs that channel first.

conformance_producer_note: >-
  As of 2026-08-26 one capture proof runs outside the broker's process.
  cmd/bindery-capture-conformance is a producer that imports no Bindery
  package: it re-declares the wire DTOs it uses and re-implements the frozen
  canonical encoding from internal/capture/canon.go, then drives identity,
  session, enrollment, batch ingest, heavy-object upload, close, normalization
  and the unauthenticated cursor read over HTTP.
  cmd/bindery-capture-conformance/conformance_test.go builds it and
  bindery-external-runtime and runs them as two operating system processes
  talking over TCP.

  What this adds over the erm301..erm304 tests is specific. Those call the
  service, or hand a synthetic request to http.Handler.ServeHTTP through
  httptest.NewRequest and NewRecorder; no socket is involved and both sides
  share the same Go types. The conformance run therefore tests two things they
  cannot: that the published contract is implementable by a program compiled
  without access to those types, and that the frozen canonical encoding is
  reproducible from its specification. The broker recomputes producer_digest
  and answers SEQUENCE_CONFLICT on a mismatch, so an accepted batch is two
  independent encoders agreeing byte for byte. Reordering two fields in the
  producer's encoder breaks the run, which is how that claim was checked.

  The run includes a negative control. It sends a well-formed batch under a
  deliberately wrong digest and requires a 4xx SEQUENCE_CONFLICT before any
  real ingest, because without it a broker that ignored producer_digest
  entirely would pass every positive step.

  It is not an RA2 adapter and does not advance ERH-006. It is the shape the
  producer half of ERM-301..304 has to take, exercised in a language CI can run
  today, and it is the first evidence in this repository that the capture
  contract survives a process boundary.

redaction_gate_note: >-
  `make redaction` was release-blocking and absent from CI until 2026-08-26.
  The oracle that keeps bearer tokens, join credentials and operational
  endpoints out of public DTOs ran only on a workstation, so nothing would have
  failed a pull request that reintroduced one. It is now a step in the
  external-runtime job and part of the verify-external-runtime target.

durability_ceiling_note: >-
  As of 2026-08-26 the durability ceiling is measured rather than described.
  See docs/assessments/2026-08-26-durability-ceiling.md; the measurements live
  in internal/externalruntime/durability_ceiling_test.go and the limit is named
  as externalruntime.MaxStateSnapshotBytes instead of an inline 64<<20.

  Roughly 7,017 two-player sessions of accumulated history fit under the 64 MiB
  limit, at about 9,563 snapshot bytes per session, with growth linear to
  within 2% across the sampled range. One ordinary mutation costs about 195 ms
  once 35 MiB has accumulated -- measured on a restored half-ceiling state
  file, not extrapolated from small samples -- because commitLocked rewrites
  the whole snapshot every time and nothing is ever deleted.

  The measurement surfaced a defect that is independent of any retention
  policy: Save has no size check while Load caps its reader at
  MaxStateSnapshotBytes, so a service that crosses the limit persists
  successfully, keeps serving from memory, and then cannot start again. It
  presents as "decode state snapshot: unexpected EOF", which reads as file
  corruption rather than as a capacity limit. Making Save refuse the write is
  small, lowers no ceiling, and is not done here; the assessment lists it first
  among the things that would move the limit.
