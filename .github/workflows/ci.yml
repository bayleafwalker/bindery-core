name: bindery-core-ci

on:
  pull_request:
  push:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/bindery-external-runtime
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bayleafwalker/bindery-core
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/bayleafwalker/bindery-core@${{ steps.build.outputs.digest }}
          artifact-name: bindery-core.spdx.json
          output-file: bindery-core.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: bindery-core-sbom
          path: bindery-core.spdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/bayleafwalker/bindery-core
          subject-digest: ${{ steps.build.outputs.digest }}

