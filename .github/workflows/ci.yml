name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt is resolved from the active GOROOT, not from PATH. setup-go
      # installs the SDK named by go.mod's `go` directive, while `go` itself
      # honours the `toolchain` directive and dispatches to a newer one -- so
      # the gofmt on PATH can be older than the toolchain actually in use, and
      # older gofmt disagrees with this repository. See the note in go.mod.
      - name: Go fmt check
        run: |
          set -euo pipefail
          go version
          gofmt_bin="$(go env GOROOT)/bin/gofmt"
          unformatted=$(
            find . -name '*.go' \
              -not -path './vendor/*' \
              -not -path './.cache/*' \
              -not -path './.gocache/*' \
              -print0 | xargs -0 "$gofmt_bin" -l
          )
          if [[ -n "$unformatted" ]]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go test
        run: go test -v ./...

      - name: Verify CRD manifests match API types
        run: make verify-crds

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Run integration tests
        run: |
          export KUBEBUILDER_ASSETS="$(setup-envtest use -p path 1.31.0)"
          BINDERY_INTEGRATION=1 go test ./... -run Integration -coverprofile cover.out

      - name: Go mod tidy check
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum

  sample-game-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Sample game unit tests
        run: |
          set -euo pipefail
          cd examples/booklet-bindery-sample
          go test -v ./...

      - name: Sample game go mod tidy check
        run: |
          set -euo pipefail
          cd examples/booklet-bindery-sample
          go mod tidy
          git diff --exit-code go.mod go.sum

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          set -euo pipefail
          curl -sSL -o kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      - name: E2E smoke test (Kind)
        env:
          BINDERY_E2E: "1"
        run: |
          set -euo pipefail
          go test -v ./e2e -run TestE2ESmoke_BinderySample -count=1 -timeout 20m

  # ERH-007's third-party run. It fetches an unmodified OpenTTD, starts a
  # dedicated server, joins real game clients over the network, and drives the
  # control plane against what the game publishes over its admin protocol. It
  # is a separate job because it depends on a third-party CDN: a fetch failure
  # should read as a fetch failure, not as a broken control plane.
  openttd-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache the game
        uses: actions/cache@v4
        with:
          path: ~/.cache/bindery/openttd
          key: openttd-15.3-opengfx-8.0

      - name: Third-party runtime acceptance
        run: make openttd-acceptance

  external-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks compares the full pushed/PR commit range. A depth-1
          # checkout cannot resolve the parent once the branch has >1 commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test (race)
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - uses: azure/setup-helm@v4

      - name: Helm lint external-runtime chart
        run: helm lint charts/bindery-external-runtime

      # Release-blocking, and absent from CI until 2026-08-26: the oracle is
      # what keeps bearer tokens, join credentials and operational endpoints
      # out of public DTOs, and it only ever ran on someone's workstation.
      - name: Redaction scan
        run: make redaction

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes both images. They share a repository and a Go module but are
  # separate artifacts with separate Dockerfiles: conflating them would let a
  # `helm install bindery-core` deploy the external-runtime service instead of
  # the operator, which is what the charts briefly both pointed at.
  #
  # Gated on main and tags rather than every push. The former external-runtime
  # workflow published on any branch, which is how a feature branch could
  # overwrite the tag a chart installs.
  image:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    needs: [go-test, external-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bindery-core
            dockerfile: Dockerfile
          - name: bindery-external-runtime
            dockerfile: Dockerfile.external-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/bayleafwalker/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64

      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/bayleafwalker/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          artifact-name: ${{ matrix.name }}.spdx.json
          output-file: ${{ matrix.name }}.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ matrix.name }}.spdx.json

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/bayleafwalker/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
